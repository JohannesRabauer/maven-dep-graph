<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dependency Graph: {{TITLE}}</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body>
<header id="topbar">
  <span id="title"></span>
  <span id="stats"></span>
  <input id="search" type="search" placeholder="Search artifacts">
  <div id="scopes"></div>
  <span class="sep"></span>
  <button id="conflict-badge" type="button"></button>
  <button id="managed-toggle" type="button">Managed</button>
  <button id="drift-toggle" type="button">Drift</button>
  <button id="expand-all" type="button">Expand all</button>
  <button id="collapse-all" type="button">Collapse all</button>
  <button id="theme-toggle" type="button">Theme</button>
</header>
<div id="filter-bar"></div>
<div id="cy"></div>
<div id="badges" aria-hidden="true"></div>
<p id="hint" aria-hidden="true">Click a node to expand it. <span class="badge more">+N</span> shows its hidden dependencies. Right-click for more.</p>
<aside id="panel" aria-label="Artifact details" hidden></aside>
<div id="context-menu" role="menu" aria-label="Node actions" hidden></div>
<p id="cy-help" class="sr-only">Arrow keys move between visible nodes. Enter or Space expands or collapses the focused node. Shift+F10 opens its menu.</p>
<div id="a11y-live" class="sr-only" role="status" aria-live="polite"></div>
<div id="warning-dialog" role="dialog" aria-modal="true" aria-labelledby="warning-text" hidden></div>
<script>
/*{{VENDOR}}*/
</script>
<script>
/*{{MODEL}}*/
</script>
<script type="application/json" id="dep-graph-data">{{DATA}}</script>
<script>
/*{{APP}}*/
</script>
</body>
</html>
