name: Pages

# Builds the static site in site/ plus two live dependency-graph pages
# generated by the plugin itself, and deploys them to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests also write target/synthetic-dep-graph.html (300-module stress page).
      - name: Build and install the plugin
        run: mvn -B -ntp -f dep-graph-maven-plugin/pom.xml install -Dinvoker.skip

      - name: Generate the demo project's graph
        run: mvn -B -ntp -f demo-project/pom.xml package -DskipTests

      - name: Assemble site
        run: |
          mkdir -p _site/demo _site/stress
          cp -r site/. _site/
          cp demo-project/target/dep-graph.html _site/demo/index.html
          cp dep-graph-maven-plugin/target/synthetic-dep-graph.html _site/stress/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
